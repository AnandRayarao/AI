<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare AI Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        .upload-section {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid #e0e0e0;
}

.upload-section h3 {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 12px;
    color: #1a1a1a;
}

.upload-row {
    display: flex;
    gap: 10px;
    align-items: center;
}

#upload-status {
    margin-top: 10px;
    font-size: 13px;
    color: #0066cc;
}

#doc-list {
    margin-top: 8px;
    font-size: 12px;
    color: #666;
}
        body {
            font-family: -apple-system, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        .chat-box {
            background: white;
            border-radius: 12px;
            padding: 20px;
            min-height: 400px;
            margin-bottom: 20px;
            border: 1px solid #e0e0e0;
        }

        .message {
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .message.user {
            font-weight: 500;
            color: #1a1a1a;
        }

        .message.user::before {
            content: "You: ";
            color: #666;
        }

        .message.claude {
            background: #f0f7ff;
            padding: 14px;
            border-radius: 8px;
            color: #1a1a1a;
            border-left: 3px solid #0066cc;
        }

        .message.claude::before {
            content: "Claude: ";
            font-weight: 500;
            color: #0066cc;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #0066cc;
        }

        button {
            padding: 12px 24px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        button:hover { background: #0052a3; }
        button:disabled { background: #ccc; cursor: default; }

        .loading {
            color: #666;
            font-size: 13px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Healthcare AI Assistant</h1>
        <p class="subtitle">Ask questions about your healthcare documents</p>
        <div class="upload-section">
    <h3>Upload a document</h3>
    <div class="upload-row">
        <input type="file" id="file-input" accept=".pdf"/>
        <button onclick="uploadFile()">Upload PDF</button>
    </div>
    <div id="upload-status"></div>
    <div id="doc-list"></div>
</div>
        
        <div class="chat-box" id="chat-box">
            <div class="message claude">
                Hello! I can answer questions about your healthcare documents. 
                What would you like to know?
            </div>
        </div>

        <div class="input-row">
            <input 
                type="text" 
                id="question-input" 
                placeholder="Ask a question about your documents..."
                onkeypress="if(event.key==='Enter') askQuestion()"
            />
            <button onclick="askQuestion()" id="ask-btn">Ask</button>
        </div>
    </div>

    <script>
        async function askQuestion() {
            const input = document.getElementById('question-input');
            const chatBox = document.getElementById('chat-box');
            const btn = document.getElementById('ask-btn');
            
            const question = input.value.trim();
            if (!question) return;

            // Show user message
            chatBox.innerHTML += `
                <div class="message user">${question}</div>
            `;

            // Show loading
            chatBox.innerHTML += `
                <div class="message loading" id="loading">Thinking...</div>
            `;

            input.value = '';
            btn.disabled = true;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question})
                });

                const data = await response.json();

                // Remove loading
                document.getElementById('loading').remove();

                // Show answer
                chatBox.innerHTML += `
                    <div class="message claude">${data.answer}</div>
                `;

            } catch (error) {
                document.getElementById('loading').remove();
                chatBox.innerHTML += `
                    <div class="message claude">Sorry, something went wrong. Please try again.</div>
                `;
            }

            btn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        async function uploadFile() {
    const fileInput = document.getElementById('file-input');
    const status = document.getElementById('upload-status');
    
    if (!fileInput.files[0]) {
        status.textContent = 'Please select a PDF file first.';
        return;
    }
    
    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    
    status.textContent = 'Uploading and processing...';
    
    try {
        const response = await fetch('/upload', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        if (data.error) {
            status.textContent = 'Error: ' + data.error;
        } else {
            status.textContent = data.message + ' (' + data.chunks + ' chunks loaded)';
            loadDocuments();
        }
    } catch (error) {
        status.textContent = 'Upload failed. Please try again.';
    }
}

async function loadDocuments() {
    const response = await fetch('/documents');
    const data = await response.json();
    const docList = document.getElementById('doc-list');
    if (data.documents.length > 0) {
        docList.textContent = 'Loaded: ' + data.documents.join(', ');
    }
}

// Load documents list on page load
loadDocuments();
    </script>
</body>
</html>
